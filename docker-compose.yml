version: '3.8'

services:
  hospital-a-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_hospital_a
    ports:
      - "5533:5432"
    volumes:
      - hospital_a_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  hospital-b-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_hospital_b
    ports:
      - "5434:5432"
    volumes:
      - hospital_b_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  hospital-c-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_hospital_c
    ports:
      - "5633:5432"
    volumes:
      - hospital_c_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  hospital-d-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_hospital_d
    ports:
      - "5733:5432"
    volumes:
      - hospital_d_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  hospital-e-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_hospital_e
    ports:
      - "5833:5432"
    volumes:
      - hospital_e_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  hospital-f-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_hospital_f
    ports:
      - "5933:5432"
    volumes:
      - hospital_f_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  control-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aegisz_control
    ports:
      - "5435:5432"
    volumes:
      - control_data:/var/lib/postgresql/data
    networks:
      - aegisz_net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    networks:
      - aegisz_net
    depends_on:
      - control-db
      - hospital-a-db
      - hospital-b-db
      - hospital-c-db
      - hospital-d-db
      - hospital-e-db
      - hospital-f-db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    networks:
      - aegisz_net
    depends_on:
      - backend

volumes:
  hospital_a_data:
  hospital_b_data:
  hospital_c_data:
  hospital_d_data:
  hospital_e_data:
  hospital_f_data:
  control_data:

networks:
  aegisz_net:
    driver: bridge
